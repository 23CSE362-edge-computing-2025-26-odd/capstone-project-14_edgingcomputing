
version: "3.9"

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  edge1:
    build: ./edge
    container_name: edge1
    environment:
      - EDGE_ID=edge1
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  edge2:
    build: ./edge
    container_name: edge2
    environment:
      - EDGE_ID=edge2
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  edge3:
    build: ./edge
    container_name: edge3
    environment:
      - EDGE_ID=edge3
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  fog:
    build: ./fog
    container_name: fog
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  cloud:
    build: ./cloud
    container_name: cloud
    ports:
      - "8501:8501"
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt

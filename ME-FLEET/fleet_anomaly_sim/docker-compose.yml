
version: "3.9"

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  edge1:
    build: ./edge
    container_name: edge1
    environment:
      - EDGE_ID=edge1
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - ANOMALY_RATE=0.01
    depends_on:
      - mqtt

  edge2:
    build: ./edge
    container_name: edge2
    environment:
      - EDGE_ID=edge2
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - ANOMALY_RATE=0.02
    depends_on:
      - mqtt

  edge3:
    build: ./edge
    container_name: edge3
    environment:
      - EDGE_ID=edge3
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - ANOMALY_RATE=0.00
    depends_on:
      - mqtt

  fog:
    build: ./fog
    container_name: fog
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - WINDOW_SIZE=50
      - Z_THRESH=2.5
    depends_on:
      - mqtt

  cloud:
    build: ./cloud
    container_name: cloud
    ports:
      - "8501:8501"
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
